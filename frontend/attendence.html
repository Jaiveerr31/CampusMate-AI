
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | CampusMate AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/attendance.css">

    <style>
        .attendance-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .attendance-controls button,
        .subject-form button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        .present-btn { background: #16a34a; }
        .absent-btn { background: #dc2626; }
        .undo-btn { background: #64748b; }
        .delete-btn { background: #991b1b; }

        .subject-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
        }

        .subject-form input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            min-width: 150px;
        }

        .subject-form button {
            background: #2563eb;
        }

        .attendance-card {
            min-width: 0;
        }

        .attendance-card h2 {
            overflow-wrap: anywhere;
        }

        .attendance-card p {
            margin-top: 12px;
        }

        #attendanceMessage {
            margin: 12px 0;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <nav class="top-nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="notes.html">📚 Notes</a>
        <a href="attendence.html">📈 Attendance</a>
        <a href="timetable.html">📅 Timetable</a>
        <a href="assignments.html">📝 Assignments</a>
    </nav>

    <div class="container">

        <h1>📈 Attendance Tracker</h1>

        <p class="subtitle">
            Monitor and manage attendance across all subjects.
        </p>

        <div class="attendance-summary">

            <div class="summary-card">
                <h2 id="overallAttendance">0%</h2>
                <p>Overall Attendance</p>
            </div>

            <div class="summary-card">
                <h2 id="totalSubjects">0</h2>
                <p>Subjects</p>
            </div>

            <div class="summary-card">
                <h2 id="safeSubjects">0</h2>
                <p>Subjects at or above 75%</p>
            </div>

        </div>

        <h2>➕ Add New Subject</h2>

        <form id="subjectForm" class="subject-form">

            <input
                type="text"
                id="subjectName"
                placeholder="Subject name"
                required
                maxlength="80">

            <input
                type="number"
                id="attendedClasses"
                placeholder="Classes attended"
                min="0"
                step="1"
                required>

            <input
                type="number"
                id="totalClasses"
                placeholder="Total classes"
                min="0"
                step="1"
                required>

            <button type="submit">
                Add Subject
            </button>

        </form>

        <p id="attendanceMessage" role="status"></p>

        <div class="attendance-grid" id="attendanceGrid">
        </div>

    </div>

    <script src="js/attendence.js"></script>

</body>
</html>
